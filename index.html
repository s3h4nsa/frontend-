<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1b1b18;
    --muted: #6b6a64;
    --line: #e4e2dc;
    --accent: #2f6f4e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 48px 20px;
  }
  header {
    max-width: 960px;
    margin: 0 auto 32px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0; }
  #grid {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    background: var(--line);
  }
  .card .body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .card h3 { margin: 0; font-size: 1rem; }
  .card .price { font-weight: 600; color: var(--accent); }
  .card .desc {
    font-size: 0.85rem;
    color: var(--muted);
    flex: 1;
  }
  #empty, #error {
    max-width: 960px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 0.95rem;
  }
  #error { color: #b3392c; }
</style>
</head>
<body>
<header>
  <h1>Products</h1>
  <p class="sub">Loaded live from Supabase.</p>
</header>

<div id="grid"></div>
<div id="empty" style="display:none;">No products yet — add some from the admin page.</div>
<div id="error" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // --- Fill these in with your own Supabase project details ---
  const SUPABASE_URL = "https://nhehzncyhcditfrrcnag.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_7ukY5lsqHvHiofPtiXg9_Q_gYjNKmZL";
  // ---------------------------------------------------------------

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const grid = document.getElementById("grid");
  const emptyEl = document.getElementById("empty");
  const errorEl = document.getElementById("error");

  function renderProducts(products) {
    grid.innerHTML = "";
    if (!products.length) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    products.forEach((p) => {
      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.src = p.image_url || "https://placehold.co/400x300?text=No+Image";
      img.alt = p.name;

      card.appendChild(img);

      const body = document.createElement("div");
      body.className = "body";
      body.innerHTML = `
        <h3>${p.name}</h3>
        <div class="price">$${Number(p.price).toFixed(2)}</div>
        <div class="desc">${p.description || ""}</div>
      `;
      card.appendChild(body);

      grid.appendChild(card);
    });
  }

  async function loadProducts() {
    const { data, error } = await supabase
      .from("products")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      errorEl.textContent = "Couldn't load products: " + error.message;
      errorEl.style.display = "block";
      return;
    }

    renderProducts(data);
  }

  loadProducts();
</script>
</body>
</html>
